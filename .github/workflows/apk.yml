name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: |
          echo "Archivos del repositorio:"
          find . -maxdepth 3 -not -path './.git*' | sort
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::No encontré settings.gradle. Falta subir los archivos del proyecto (carpeta app, build.gradle, settings.gradle...)."
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          echo "Compilando en: $(pwd)"
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/RegistroClases.apk"

      - name: Publicar versión con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Registro de Clases versión ${{ github.run_number }}
          body: Descarga RegistroClases.apk desde el teléfono e instálalo encima de la versión anterior.
          files: RegistroClases.apk
